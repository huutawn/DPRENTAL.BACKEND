# Maintained on payment/develop-ci-cd; payment/develop intentionally omits this workflow.
name: PaymentService CI/CD (dev)

on:
  push:
    branches:
      - payment/develop-ci-cd

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.name }} image to GHCR
    runs-on: ubuntu-24.04
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: payment-runtime
            target: runtime
            image_name: dprental-payment
          - name: payment-migrator
            target: migrator
            image_name: dprental-payment-migrator
          - name: integrity-runtime
            target: runtime-integrity
            image_name: dprental-payment-integrity
          - name: integrity-migrator
            target: migrator-integrity
            image_name: dprental-payment-integrity-migrator
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GHCR namespace
        id: image-name
        env:
          IMAGE_NAMESPACE: ${{ vars.GHCR_IMAGE_NAMESPACE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_NAMESPACE"
          case "$IMAGE_NAMESPACE" in
            *[!a-z0-9._-]* | *[A-Z]*)
              echo 'GHCR_IMAGE_NAMESPACE must be lowercase and contain only a-z, 0-9, dot, underscore, or hyphen.' >&2
              exit 1
              ;;
          esac
          printf 'namespace=%s\n' "$IMAGE_NAMESPACE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish PaymentService ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ steps.image-name.outputs.namespace }}/${{ matrix.image_name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy-dev:
    name: Deploy PaymentService to dev VPS
    needs: publish
    runs-on: ubuntu-24.04
    environment: dev
    concurrency:
      group: dprental-dev
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/deploy-paymentservice.sh
          sparse-checkout-cone-mode: false
      - name: Deploy the published revision
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEV_VPS_SSH_PRIVATE_KEY }}
          DEPLOY_VPS_KNOWN_HOSTS: ${{ secrets.DEV_VPS_KNOWN_HOSTS }}
          DEPLOY_VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          DEPLOY_VPS_USER: ${{ secrets.DEV_VPS_USER }}
          DEPLOY_VPS_PORT: ${{ secrets.DEV_VPS_PORT || '22' }}
          RELEASE_SHA: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_VPS_KNOWN_HOSTS"
          test -n "$DEPLOY_VPS_HOST"
          test -n "$DEPLOY_VPS_USER"
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_TOKEN"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null' EXIT
          ssh-add - <<< "$DEPLOY_SSH_PRIVATE_KEY" >/dev/null
          { printf '%s\n' "$GHCR_USERNAME" "$GHCR_TOKEN"; cat scripts/deploy-paymentservice.sh; } | ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_VPS_PORT" \
            "$DEPLOY_VPS_USER@$DEPLOY_VPS_HOST" \
            "bash -c 'IFS= read -r GHCR_USERNAME; IFS= read -r GHCR_TOKEN; export GHCR_USERNAME GHCR_TOKEN; exec bash -s -- \"\$1\"' -- $RELEASE_SHA"
