name: AuthService CI/CD (dev)

on:
  pull_request:
    branches:
      - auth/develop-ci-cd
  push:
    branches:
      - auth/develop-ci-cd

permissions:
  contents: read

jobs:
  validate:
    name: Validate source, tests, and Docker artifacts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify synchronization with auth/develop
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/auth/develop:refs/remotes/origin/auth/develop"
          git merge-base --is-ancestor origin/auth/develop HEAD

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AuthService.sln --nologo

      - name: Build
        run: dotnet build AuthService.sln --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test AuthService.sln --configuration Release --no-build --nologo

      - name: Build runtime image
        run: docker build --target runtime --tag authservice-ci-runtime:${{ github.sha }} .

      - name: Build migrator image
        run: docker build --target migrator --tag authservice-ci-migrator:${{ github.sha }} .

  publish:
    name: Publish immutable images to GHCR
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/auth/develop-ci-cd'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GHCR namespace
        id: image-name
        env:
          IMAGE_NAMESPACE: ${{ vars.GHCR_IMAGE_NAMESPACE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_NAMESPACE"
          case "$IMAGE_NAMESPACE" in
            *[!a-z0-9._-]* | *[A-Z]*)
              echo 'GHCR_IMAGE_NAMESPACE must be lowercase and contain only a-z, 0-9, dot, underscore, or hyphen.' >&2
              exit 1
              ;;
          esac
          printf 'namespace=%s\n' "$IMAGE_NAMESPACE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish AuthService runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ghcr.io/${{ steps.image-name.outputs.namespace }}/dprental-auth:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish AuthService migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ghcr.io/${{ steps.image-name.outputs.namespace }}/dprental-auth-migrator:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy-dev:
    name: Deploy AuthService to dev VPS
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/auth/develop-ci-cd'
    runs-on: ubuntu-24.04
    environment: dev
    concurrency:
      group: dprental-dev
      cancel-in-progress: false

    steps:
      - name: Configure SSH trust
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEV_VPS_SSH_PRIVATE_KEY }}
          DEPLOY_VPS_KNOWN_HOSTS: ${{ secrets.DEV_VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_VPS_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          chmod 0644 "$HOME/.ssh/known_hosts"

      - name: Deploy the published revision
        env:
          DEPLOY_VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          DEPLOY_VPS_USER: ${{ secrets.DEV_VPS_USER }}
          DEPLOY_VPS_PORT: ${{ secrets.DEV_VPS_PORT || '22' }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_VPS_HOST"
          test -n "$DEPLOY_VPS_USER"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_VPS_PORT" \
            "$DEPLOY_VPS_USER@$DEPLOY_VPS_HOST" \
            /opt/dprental/dev/scripts/deploy-authservice.sh "$RELEASE_SHA"
