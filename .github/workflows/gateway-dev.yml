name: Gateway CI/CD (dev)

on:
  pull_request:
    branches:
      - gateway/develop-ci-cd
  push:
    branches:
      - gateway/develop-ci-cd

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify synchronization with gateway/develop
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/gateway/develop:refs/remotes/origin/gateway/develop"
          git merge-base --is-ancestor origin/gateway/develop HEAD

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Gateway/Gateway.sln --nologo

      - name: Build
        run: dotnet build Gateway/Gateway.sln --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test Gateway/Gateway.sln --configuration Release --no-build --nologo

      - name: Build runtime image
        if: github.event_name == 'pull_request'
        run: docker build --target runtime --tag gateway-ci-runtime:${{ github.sha }} .

  release:
    name: Publish and deploy Gateway to dev VPS
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/gateway/develop-ci-cd'
    runs-on: ubuntu-24.04
    environment: dev
    concurrency:
      group: dprental-dev
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GHCR namespace
        env:
          IMAGE_NAMESPACE: ${{ vars.GHCR_IMAGE_NAMESPACE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IMAGE_NAMESPACE"
          case "$IMAGE_NAMESPACE" in
            *[!a-z0-9._-]* | *[A-Z]*)
              echo 'GHCR_IMAGE_NAMESPACE must be lowercase and contain only a-z, 0-9, dot, underscore, or hyphen.' >&2
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Gateway runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ vars.GHCR_IMAGE_NAMESPACE }}/dprental-gateway:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Run deployment over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEV_VPS_HOST }}
          username: ${{ secrets.DEV_VPS_USER }}
          port: ${{ secrets.DEV_VPS_PORT || '22' }}
          key: ${{ secrets.DEV_VPS_SSH_PRIVATE_KEY }}
          envs: GITHUB_SHA,GHCR_USERNAME,GHCR_TOKEN
          script_path: scripts/deploy-gateway.sh
