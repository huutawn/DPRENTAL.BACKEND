# ==============================================================================
# DPRENTAL API Gateway - Docker Compose Service Definition
# ==============================================================================
services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dprental-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Môi trường chạy ứng dụng ASP.NET Core
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080

      # Cấu hình AuthService JWT & JWKS
      - Gateway__Authentication__Jwt__Issuer=${GATEWAY_JWT_ISSUER:-dprental-authservice-dev}
      - Gateway__Authentication__Jwt__Audience=${GATEWAY_JWT_AUDIENCE:-dprental-clients}
      - Gateway__Authentication__Jwt__JwksUri=${GATEWAY_JWKS_URI:-http://host.docker.internal:5000/.well-known/jwks.json}

      # Cấu hình Upstream URL cho YARP Reverse Proxy
      - ReverseProxy__Clusters__auth-service__Destinations__primary__Address=${AUTH_SERVICE_UPSTREAM_URL:-http://host.docker.internal:5000/}

      # Cấu hình Bảo mật CORS & Kích thước Payload
      - Gateway__Security__Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN_0:-http://localhost:3000}
      - Gateway__Security__Cors__AllowedOrigins__1=${CORS_ALLOWED_ORIGIN_1:-http://localhost:5173}
      - Gateway__Security__RequestSize__MaxRequestBodySizeBytes=${MAX_REQUEST_BODY_SIZE_BYTES:-10485760}

      # Cấu hình Điều phối lưu lượng & Phục hồi
      - Gateway__Traffic__Resilience__DefaultTimeoutSeconds=${DEFAULT_TIMEOUT_SECONDS:-10}
      - Gateway__Traffic__RateLimiting__Anonymous__PermitLimit=${RATE_LIMIT_ANONYMOUS_PERMIT:-20}
      - Gateway__Traffic__RateLimiting__Authenticated__PermitLimit=${RATE_LIMIT_AUTHENTICATED_PERMIT:-100}
      - Gateway__Traffic__RateLimiting__Sensitive__PermitLimit=${RATE_LIMIT_SENSITIVE_PERMIT:-5}

      # Cấu hình Distributed Tracing (Tùy chọn)
      - Telemetry__Tracing__SamplingRatio=${TRACING_SAMPLING_RATIO:-1.0}
      - Telemetry__Otlp__TracesEndpoint=${OTLP_TRACES_ENDPOINT:-}

    # Cho phép container gọi ngược về host machine (ví dụ AuthService đang chạy ở http://localhost:5000)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - dprental-network

# Mạng Docker dùng chung giữa Gateway và các microservices khác
networks:
  dprental-network:
    name: dprental-network
    driver: bridge
