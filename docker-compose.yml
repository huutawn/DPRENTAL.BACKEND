# ==============================================================================
# DPRENTAL API Gateway - Docker Compose Service Definition
# ==============================================================================
# Hỗ trợ tùy biến linh hoạt giữa 2 chế độ:
# 1. Chế độ Docker Network: Tự động phân giải qua tên service "auth-service" trong mạng dprental-network.
# 2. Chế độ kết nối Host: Tự động gọi về AuthService trên máy host qua "host.docker.internal:64837".
# ==============================================================================
services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dprental-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Môi trường chạy ứng dụng ASP.NET Core
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080

      # Cấu hình AuthService JWT & JWKS (Tự động dùng AUTH_SERVICE_HOST/PORT nếu không override)
      - Gateway__Authentication__Jwt__Issuer=${GATEWAY_JWT_ISSUER:-dprental-authservice-dev}
      - Gateway__Authentication__Jwt__Audience=${GATEWAY_JWT_AUDIENCE:-dprental-clients}
      - Gateway__Authentication__Jwt__JwksUri=${GATEWAY_JWKS_URI:-http://${AUTH_SERVICE_HOST:-auth-service}:${AUTH_SERVICE_PORT:-5000}/.well-known/jwks.json}

      # Cấu hình Upstream cho Ocelot Routes (Host, Port, Scheme)
      - Routes__0__DownstreamScheme=${AUTH_SERVICE_SCHEME:-http}
      - Routes__0__DownstreamHostAndPorts__0__Host=${AUTH_SERVICE_HOST:-auth-service}
      - Routes__0__DownstreamHostAndPorts__0__Port=${AUTH_SERVICE_PORT:-5000}
      - Routes__1__DownstreamScheme=${AUTH_SERVICE_SCHEME:-http}
      - Routes__1__DownstreamHostAndPorts__0__Host=${AUTH_SERVICE_HOST:-auth-service}
      - Routes__1__DownstreamHostAndPorts__0__Port=${AUTH_SERVICE_PORT:-5000}
      - Routes__2__DownstreamScheme=${AUTH_SERVICE_SCHEME:-http}
      - Routes__2__DownstreamHostAndPorts__0__Host=${AUTH_SERVICE_HOST:-auth-service}
      - Routes__2__DownstreamHostAndPorts__0__Port=${AUTH_SERVICE_PORT:-5000}
      - Routes__3__DownstreamScheme=${AUTH_SERVICE_SCHEME:-http}
      - Routes__3__DownstreamHostAndPorts__0__Host=${AUTH_SERVICE_HOST:-auth-service}
      - Routes__3__DownstreamHostAndPorts__0__Port=${AUTH_SERVICE_PORT:-5000}

      # Catalog routes 8..13: public GET, authenticated commands, OpenAPI
      - Routes__8__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__8__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__8__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}
      - Routes__9__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__9__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__9__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}
      - Routes__10__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__10__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__10__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}
      - Routes__11__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__11__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__11__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}
      - Routes__12__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__12__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__12__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}
      - Routes__13__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__13__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__13__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}

      # Cấu hình Bảo mật CORS & Kích thước Payload
      - Gateway__Security__Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN_0:-http://localhost:3000}
      - Gateway__Security__Cors__AllowedOrigins__1=${CORS_ALLOWED_ORIGIN_1:-http://localhost:5173}
      - Gateway__Security__RequestSize__MaxRequestBodySizeBytes=${MAX_REQUEST_BODY_SIZE_BYTES:-10485760}

      # Cấu hình Rate Limiting
      - Gateway__Security__RateLimiting__WindowSeconds=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - Gateway__Security__RateLimiting__SegmentsPerWindow=${RATE_LIMIT_SEGMENTS_PER_WINDOW:-6}
      - Gateway__Security__RateLimiting__UserReadLimit=${RATE_LIMIT_USER_READ:-300}
      - Gateway__Security__RateLimiting__UserWriteLimit=${RATE_LIMIT_USER_WRITE:-30}
      - Gateway__Security__RateLimiting__IpReadLimit=${RATE_LIMIT_IP_READ:-1200}
      - Gateway__Security__RateLimiting__IpWriteLimit=${RATE_LIMIT_IP_WRITE:-120}

      # Thời gian chờ proxy tới downstream
      - GlobalConfiguration__Timeout=${DEFAULT_TIMEOUT_SECONDS:-10}

    # Cho phép container gọi ngược về máy host (khi AuthService chạy trực tiếp trên host tại http://localhost:64837)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - dprental-network

# Mạng Docker dùng chung giữa Gateway và các microservices khác trong hệ thống DPRENTAL
networks:
  dprental-network:
    name: dprental-network
    driver: bridge
