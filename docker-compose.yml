services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paymentservice}
      POSTGRES_USER: ${POSTGRES_USER:-paymentservice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432"
    volumes:
      - payment-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-integrity:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${INTEGRITY_POSTGRES_DB:-integrity_evidence}
      POSTGRES_USER: ${INTEGRITY_POSTGRES_USER:-integrityservice}
      POSTGRES_PASSWORD: ${INTEGRITY_POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${INTEGRITY_POSTGRES_PORT:-26281}:5432"
    volumes:
      - integrity-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payment-pg:
  integrity-pg:
