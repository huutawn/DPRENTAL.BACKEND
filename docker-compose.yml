# ==============================================================================
# DPRENTAL API Gateway - Docker Compose Service Definition
# ==============================================================================
# Hỗ trợ tùy biến linh hoạt giữa 2 chế độ:
# 1. Chế độ Docker Network: Tự động phân giải qua tên service "auth-service" trong mạng dprental-network.
# 2. Chế độ kết nối Host: Tự động gọi về AuthService trên máy host qua "host.docker.internal:64837".
# ==============================================================================
services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dprental-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Môi trường chạy ứng dụng ASP.NET Core
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080

      # Cấu hình AuthService JWT & JWKS (Tự động dùng AUTH_SERVICE_HOST/PORT nếu không override)
      - Gateway__Authentication__Jwt__Issuer=${GATEWAY_JWT_ISSUER:-dprental-authservice-dev}
      - Gateway__Authentication__Jwt__Audience=${GATEWAY_JWT_AUDIENCE:-dprental-clients}
      - Gateway__Authentication__Jwt__JwksUri=${GATEWAY_JWKS_URI:-http://${AUTH_SERVICE_HOST:-auth-service}:${AUTH_SERVICE_PORT:-5000}/.well-known/jwks.json}

      # Cấu hình Upstream cho Ocelot Routes (Host, Port, Scheme) cho đầy đủ service qua DNS Docker
      # [00] Analytics: analytics-hub-negotiate
      - Routes__0__DownstreamScheme=${ANALYTICS_SERVICE_SCHEME:-http}
      - Routes__0__DownstreamHostAndPorts__0__Host=${ANALYTICS_SERVICE_HOST:-analytics-service}
      - Routes__0__DownstreamHostAndPorts__0__Port=${ANALYTICS_SERVICE_PORT:-8080}
      # [01] Analytics: analytics-hub-ws
      - Routes__1__DownstreamScheme=${ANALYTICS_SERVICE_WS_SCHEME:-ws}
      - Routes__1__DownstreamHostAndPorts__0__Host=${ANALYTICS_SERVICE_HOST:-analytics-service}
      - Routes__1__DownstreamHostAndPorts__0__Port=${ANALYTICS_SERVICE_PORT:-8080}
      # [02] Analytics: analytics-api
      - Routes__2__DownstreamScheme=${ANALYTICS_SERVICE_SCHEME:-http}
      - Routes__2__DownstreamHostAndPorts__0__Host=${ANALYTICS_SERVICE_HOST:-analytics-service}
      - Routes__2__DownstreamHostAndPorts__0__Port=${ANALYTICS_SERVICE_PORT:-8080}
      # [03] Analytics: analytics-service-openapi
      - Routes__3__DownstreamScheme=${ANALYTICS_SERVICE_SCHEME:-http}
      - Routes__3__DownstreamHostAndPorts__0__Host=${ANALYTICS_SERVICE_HOST:-analytics-service}
      - Routes__3__DownstreamHostAndPorts__0__Port=${ANALYTICS_SERVICE_PORT:-8080}
      # [04] Auth: auth-service-google-provider-callback
      - Routes__4__DownstreamScheme=${AUTH_SERVICE_SCHEME:-http}
      - Routes__4__DownstreamHostAndPorts__0__Host=${AUTH_SERVICE_HOST:-auth-service}
      - Routes__4__DownstreamHostAndPorts__0__Port=${AUTH_SERVICE_PORT:-5000}
      # [05] Auth: auth-service
      - Routes__5__DownstreamScheme=${AUTH_SERVICE_SCHEME:-http}
      - Routes__5__DownstreamHostAndPorts__0__Host=${AUTH_SERVICE_HOST:-auth-service}
      - Routes__5__DownstreamHostAndPorts__0__Port=${AUTH_SERVICE_PORT:-5000}
      # [06] Auth: auth-service-openapi
      - Routes__6__DownstreamScheme=${AUTH_SERVICE_SCHEME:-http}
      - Routes__6__DownstreamHostAndPorts__0__Host=${AUTH_SERVICE_HOST:-auth-service}
      - Routes__6__DownstreamHostAndPorts__0__Port=${AUTH_SERVICE_PORT:-5000}
      # [07] Catalog: catalog-service-public-categories
      - Routes__7__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__7__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__7__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}
      # [08] Catalog: catalog-service-public-category-detail
      - Routes__8__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__8__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__8__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}
      # [09] Catalog: catalog-service-public-equipment-types
      - Routes__9__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__9__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__9__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}
      # [10] Catalog: catalog-service-public-equipment-type-detail
      - Routes__10__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__10__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__10__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}
      # [11] Catalog: catalog-service
      - Routes__11__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__11__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__11__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}
      # [12] Catalog: catalog-service-openapi
      - Routes__12__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__12__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__12__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}
      # [13] Catalog: catalog-service-public-brands
      - Routes__13__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__13__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__13__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}
      # [14] Catalog: catalog-service-public-brand-detail
      - Routes__14__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__14__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__14__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}
      # [15] Catalog: catalog-service-public-equipment-current-schema
      - Routes__15__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__15__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__15__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}
      # [16] Catalog: catalog-service-public-equipment-schema-version
      - Routes__16__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__16__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__16__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}
      # [17] Catalog: catalog-service-public-equipment-spec-schema-version
      - Routes__17__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__17__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__17__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}
      # [18] Catalog: catalog-service-public-equipment-schemas-batch
      - Routes__18__DownstreamScheme=${CATALOG_SERVICE_SCHEME:-http}
      - Routes__18__DownstreamHostAndPorts__0__Host=${CATALOG_SERVICE_HOST:-catalog-service}
      - Routes__18__DownstreamHostAndPorts__0__Port=${CATALOG_SERVICE_PORT:-8080}

      # [19] Inventory: inventory-service
      - Routes__19__DownstreamScheme=${INVENTORY_SERVICE_SCHEME:-http}
      - Routes__19__DownstreamHostAndPorts__0__Host=${INVENTORY_SERVICE_HOST:-inventory-service}
      - Routes__19__DownstreamHostAndPorts__0__Port=${INVENTORY_SERVICE_PORT:-8080}
      # [20] Inventory: inventory-service-openapi
      - Routes__20__DownstreamScheme=${INVENTORY_SERVICE_SCHEME:-http}
      - Routes__20__DownstreamHostAndPorts__0__Host=${INVENTORY_SERVICE_HOST:-inventory-service}
      - Routes__20__DownstreamHostAndPorts__0__Port=${INVENTORY_SERVICE_PORT:-8080}
      # [21] Inventory: inventory-service-public-equipment-listings
      - Routes__21__DownstreamScheme=${INVENTORY_SERVICE_SCHEME:-http}
      - Routes__21__DownstreamHostAndPorts__0__Host=${INVENTORY_SERVICE_HOST:-inventory-service}
      - Routes__21__DownstreamHostAndPorts__0__Port=${INVENTORY_SERVICE_PORT:-8080}
      # [22] Inventory: inventory-service-public-equipment-listing-detail
      - Routes__22__DownstreamScheme=${INVENTORY_SERVICE_SCHEME:-http}
      - Routes__22__DownstreamHostAndPorts__0__Host=${INVENTORY_SERVICE_HOST:-inventory-service}
      - Routes__22__DownstreamHostAndPorts__0__Port=${INVENTORY_SERVICE_PORT:-8080}
      # [23] Inventory: inventory-service-public-listing-availability-check
      - Routes__23__DownstreamScheme=${INVENTORY_SERVICE_SCHEME:-http}
      - Routes__23__DownstreamHostAndPorts__0__Host=${INVENTORY_SERVICE_HOST:-inventory-service}
      - Routes__23__DownstreamHostAndPorts__0__Port=${INVENTORY_SERVICE_PORT:-8080}
      # [24] Inventory: inventory-service-public-availability-check
      - Routes__24__DownstreamScheme=${INVENTORY_SERVICE_SCHEME:-http}
      - Routes__24__DownstreamHostAndPorts__0__Host=${INVENTORY_SERVICE_HOST:-inventory-service}
      - Routes__24__DownstreamHostAndPorts__0__Port=${INVENTORY_SERVICE_PORT:-8080}
      # [25] Inventory: inventory-service-public-equipment-listings-statistics
      - Routes__25__DownstreamScheme=${INVENTORY_SERVICE_SCHEME:-http}
      - Routes__25__DownstreamHostAndPorts__0__Host=${INVENTORY_SERVICE_HOST:-inventory-service}
      - Routes__25__DownstreamHostAndPorts__0__Port=${INVENTORY_SERVICE_PORT:-8080}
      # [26] Media: media-service-public-content
      - Routes__26__DownstreamScheme=${MEDIA_SERVICE_SCHEME:-http}
      - Routes__26__DownstreamHostAndPorts__0__Host=${MEDIA_SERVICE_HOST:-media-service}
      - Routes__26__DownstreamHostAndPorts__0__Port=${MEDIA_SERVICE_PORT:-8080}
      # [27] Media: media-service
      - Routes__27__DownstreamScheme=${MEDIA_SERVICE_SCHEME:-http}
      - Routes__27__DownstreamHostAndPorts__0__Host=${MEDIA_SERVICE_HOST:-media-service}
      - Routes__27__DownstreamHostAndPorts__0__Port=${MEDIA_SERVICE_PORT:-8080}
      # [28] Media: media-service-openapi
      - Routes__28__DownstreamScheme=${MEDIA_SERVICE_SCHEME:-http}
      - Routes__28__DownstreamHostAndPorts__0__Host=${MEDIA_SERVICE_HOST:-media-service}
      - Routes__28__DownstreamHostAndPorts__0__Port=${MEDIA_SERVICE_PORT:-8080}
      # [29] Payment: payment-hub-negotiate
      - Routes__29__DownstreamScheme=${PAYMENT_SERVICE_SCHEME:-http}
      - Routes__29__DownstreamHostAndPorts__0__Host=${PAYMENT_SERVICE_HOST:-payment-service}
      - Routes__29__DownstreamHostAndPorts__0__Port=${PAYMENT_SERVICE_PORT:-8080}
      # [30] Payment: payment-hub-ws
      - Routes__30__DownstreamScheme=${PAYMENT_SERVICE_WS_SCHEME:-ws}
      - Routes__30__DownstreamHostAndPorts__0__Host=${PAYMENT_SERVICE_HOST:-payment-service}
      - Routes__30__DownstreamHostAndPorts__0__Port=${PAYMENT_SERVICE_PORT:-8080}
      # [31] Payment: payment-service-openapi
      - Routes__31__DownstreamScheme=${PAYMENT_SERVICE_SCHEME:-http}
      - Routes__31__DownstreamHostAndPorts__0__Host=${PAYMENT_SERVICE_HOST:-payment-service}
      - Routes__31__DownstreamHostAndPorts__0__Port=${PAYMENT_SERVICE_PORT:-8080}
      # [32] Payment: payment-service-payment
      - Routes__32__DownstreamScheme=${PAYMENT_SERVICE_SCHEME:-http}
      - Routes__32__DownstreamHostAndPorts__0__Host=${PAYMENT_SERVICE_HOST:-payment-service}
      - Routes__32__DownstreamHostAndPorts__0__Port=${PAYMENT_SERVICE_PORT:-8080}
      # [33] Recommendation: recommendation-service-ready
      - Routes__33__DownstreamScheme=${RECOMMENDATION_SERVICE_SCHEME:-http}
      - Routes__33__DownstreamHostAndPorts__0__Host=${RECOMMENDATION_SERVICE_HOST:-recommendation-service}
      - Routes__33__DownstreamHostAndPorts__0__Port=${RECOMMENDATION_SERVICE_PORT:-8080}
      # [34] Rental: rental-order-hub-negotiate
      - Routes__34__DownstreamScheme=${RENTAL_SERVICE_SCHEME:-http}
      - Routes__34__DownstreamHostAndPorts__0__Host=${RENTAL_SERVICE_HOST:-rental-service}
      - Routes__34__DownstreamHostAndPorts__0__Port=${RENTAL_SERVICE_PORT:-8080}
      # [35] Rental: rental-order-hub-ws
      - Routes__35__DownstreamScheme=${RENTAL_SERVICE_WS_SCHEME:-ws}
      - Routes__35__DownstreamHostAndPorts__0__Host=${RENTAL_SERVICE_HOST:-rental-service}
      - Routes__35__DownstreamHostAndPorts__0__Port=${RENTAL_SERVICE_PORT:-8080}
      # [36] Rental: rental-service
      - Routes__36__DownstreamScheme=${RENTAL_SERVICE_SCHEME:-http}
      - Routes__36__DownstreamHostAndPorts__0__Host=${RENTAL_SERVICE_HOST:-rental-service}
      - Routes__36__DownstreamHostAndPorts__0__Port=${RENTAL_SERVICE_PORT:-8080}
      # [37] Rental: rental-service-openapi
      - Routes__37__DownstreamScheme=${RENTAL_SERVICE_SCHEME:-http}
      - Routes__37__DownstreamHostAndPorts__0__Host=${RENTAL_SERVICE_HOST:-rental-service}
      - Routes__37__DownstreamHostAndPorts__0__Port=${RENTAL_SERVICE_PORT:-8080}

      # Cấu hình Bảo mật CORS & Kích thước Payload
      - Gateway__Security__Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN_0:-http://localhost:3000}
      - Gateway__Security__Cors__AllowedOrigins__1=${CORS_ALLOWED_ORIGIN_1:-http://localhost:5173}
      - Gateway__Security__RequestSize__MaxRequestBodySizeBytes=${MAX_REQUEST_BODY_SIZE_BYTES:-10485760}

      # Cấu hình Rate Limiting
      - Gateway__Security__RateLimiting__WindowSeconds=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - Gateway__Security__RateLimiting__SegmentsPerWindow=${RATE_LIMIT_SEGMENTS_PER_WINDOW:-6}
      - Gateway__Security__RateLimiting__UserReadLimit=${RATE_LIMIT_USER_READ:-300}
      - Gateway__Security__RateLimiting__UserWriteLimit=${RATE_LIMIT_USER_WRITE:-30}
      - Gateway__Security__RateLimiting__IpReadLimit=${RATE_LIMIT_IP_READ:-1200}
      - Gateway__Security__RateLimiting__IpWriteLimit=${RATE_LIMIT_IP_WRITE:-120}

      # Thời gian chờ proxy tới downstream
      - GlobalConfiguration__Timeout=${DEFAULT_TIMEOUT_SECONDS:-10}

    # Cho phép container gọi ngược về máy host (khi AuthService chạy trực tiếp trên host tại http://localhost:64837)
    extra_hosts:
      - "host.docker.internal:host-gateway"

      # [43] Review
      - Routes__43__DownstreamScheme=${REVIEW_SERVICE_SCHEME:-http}
      - Routes__43__DownstreamHostAndPorts__0__Host=${REVIEW_SERVICE_HOST:-review-service}
      - Routes__43__DownstreamHostAndPorts__0__Port=${REVIEW_SERVICE_PORT:-8080}
      # [44] Review
      - Routes__44__DownstreamScheme=${REVIEW_SERVICE_SCHEME:-http}
      - Routes__44__DownstreamHostAndPorts__0__Host=${REVIEW_SERVICE_HOST:-review-service}
      - Routes__44__DownstreamHostAndPorts__0__Port=${REVIEW_SERVICE_PORT:-8080}
      # [45] Review
      - Routes__45__DownstreamScheme=${REVIEW_SERVICE_SCHEME:-http}
      - Routes__45__DownstreamHostAndPorts__0__Host=${REVIEW_SERVICE_HOST:-review-service}
      - Routes__45__DownstreamHostAndPorts__0__Port=${REVIEW_SERVICE_PORT:-8080}
      # [46] Review
      - Routes__46__DownstreamScheme=${REVIEW_SERVICE_SCHEME:-http}
      - Routes__46__DownstreamHostAndPorts__0__Host=${REVIEW_SERVICE_HOST:-review-service}
      - Routes__46__DownstreamHostAndPorts__0__Port=${REVIEW_SERVICE_PORT:-8080}
      # [47] Review
      - Routes__47__DownstreamScheme=${REVIEW_SERVICE_SCHEME:-http}
      - Routes__47__DownstreamHostAndPorts__0__Host=${REVIEW_SERVICE_HOST:-review-service}
      - Routes__47__DownstreamHostAndPorts__0__Port=${REVIEW_SERVICE_PORT:-8080}
    networks:
      - dprental-network

# Mạng Docker dùng chung giữa Gateway và các microservices khác trong hệ thống DPRENTAL
networks:
  dprental-network:
    name: dprental-network
    driver: bridge
