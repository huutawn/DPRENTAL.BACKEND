  analytics-service:
    image: ${ANALYTICS_SERVICE_IMAGE:?Set ANALYTICS_SERVICE_IMAGE in release.env}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Staging}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Authentication__Jwt__Issuer: ${AUTH_JWT_ISSUER:?Set AUTH_JWT_ISSUER in .env}
      Authentication__Jwt__Audience: ${AUTH_JWT_AUDIENCE:?Set AUTH_JWT_AUDIENCE in .env}
      Authentication__Jwt__JwksUri: http://auth-service:8080/.well-known/jwks.json
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
      Kafka__ProofIssuer: ${KAFKA_PROOF_ISSUER:-dprental-integrity-host}
      Kafka__ProofEnvironment: ${KAFKA_PROOF_ENVIRONMENT:-staging}
      Kafka__ProofPublicKeys__dev-payment-integrity-v1: ${PAYMENT_INTEGRITY_PUBLIC_KEY_BASE64:?Set PAYMENT_INTEGRITY_PUBLIC_KEY_BASE64 in .env}
      AnalyticsHub__HubPath: /hubs/analytics
      AnalyticsHub__AllowedOrigins__0: https://${DEV_APP_DOMAIN:?Set DEV_APP_DOMAIN in .env}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - edge
      - services

  analytics-migrate:
    image: ${ANALYTICS_MIGRATOR_IMAGE:?Set ANALYTICS_MIGRATOR_IMAGE in release.env}
    profiles: [migration]
    restart: "no"
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - services
  kafka:
    image: ${KAFKA_IMAGE:?Set KAFKA_IMAGE in .env}
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_LOG4J_OPTS: "-Dlog4j2.configurationFile=/etc/kafka/log4j2.yaml"
      KAFKA_GC_LOG_OPTS: "-Xlog:gc*:file=/opt/kafka/logs/kafkaServer-gc.log:time,tags:filecount=5,filesize=10M"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
      - ./kafka-log4j2.yaml:/etc/kafka/log4j2.yaml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - services
  media-service:
    image: ${MEDIA_SERVICE_IMAGE:?Set MEDIA_SERVICE_IMAGE in release.env}
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Staging}
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - ObjectStorage__Endpoint=http://media-minio:9000
      - ObjectStorage__BrowserEndpoint=https://${DEV_DOMAIN:?Set DEV_DOMAIN in .env}
      - ObjectStorage__Bucket=dprental-media
      - ObjectStorage__AccessKey=${MEDIA_MINIO_ROOT_USER:?Set MEDIA_MINIO_ROOT_USER in .env}
      - ObjectStorage__SecretKey=${MEDIA_MINIO_ROOT_PASSWORD:?Set MEDIA_MINIO_ROOT_PASSWORD in .env}
      - Jwt__Issuer=${AUTH_JWT_ISSUER:?Set AUTH_JWT_ISSUER in .env}
      - Jwt__Audience=${AUTH_JWT_AUDIENCE:?Set AUTH_JWT_AUDIENCE in .env}
      - Jwt__JwksUri=http://auth-service:8080/.well-known/jwks.json
      - ApiKey=${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      - InternalAuthentication__ApiKey=${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
    depends_on:
      auth-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      media-minio-init:
        condition: service_completed_successfully
    networks:
      - services

  media-migrate:
    image: ${MEDIA_MIGRATOR_IMAGE:?Set MEDIA_MIGRATOR_IMAGE in release.env}
    profiles: [migration]
    restart: "no"
    entrypoint:
      - /tools/dotnet-ef
      - database
      - update
      - --project
      - MediaService/src/Domain/MediaService.Domain.csproj
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - services

  media-minio:
    image: ${MEDIA_MINIO_IMAGE:?Set MEDIA_MINIO_IMAGE in .env}
    command: [server, /data, --console-address, ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MEDIA_MINIO_ROOT_USER:?Set MEDIA_MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MEDIA_MINIO_ROOT_PASSWORD:?Set MEDIA_MINIO_ROOT_PASSWORD in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${DEV_APP_DOMAIN:?Set DEV_APP_DOMAIN in .env}
    volumes:
      - media-minio-data:/data
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - services
      - edge

  media-minio-init:
    image: ${MEDIA_MINIO_IMAGE:?Set MEDIA_MINIO_IMAGE in .env}
    restart: "no"
    depends_on:
      media-minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://media-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/dprental-media
        mc anonymous set none local/dprental-media
    environment:
      MINIO_ROOT_USER: ${MEDIA_MINIO_ROOT_USER:?Set MEDIA_MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MEDIA_MINIO_ROOT_PASSWORD:?Set MEDIA_MINIO_ROOT_PASSWORD in .env}
    networks:
      - services

  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - services

  valkey:
    image: ${VALKEY_IMAGE:?Set VALKEY_IMAGE in .env}
    restart: unless-stopped
    command: [valkey-server, --appendonly, 'yes']
    volumes:
      - valkey-data:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - services

secrets:
  auth_jwt_private_key:
    file: ${SECRETS_DIR:?Set SECRETS_DIR in .env}/auth-jwt-private.pem
  auth_jwt_public_key:
    file: ${SECRETS_DIR:?Set SECRETS_DIR in .env}/auth-jwt-public.pem

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  valkey-data:
  media-minio-data:
  kafka-data:

networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_NETWORK_CIDR:-172.30.0.0/24}
  services:
    internal: true
