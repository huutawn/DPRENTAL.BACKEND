name: dprental-dev

services:
  review-service:
    image: ${REVIEW_SERVICE_IMAGE:?Set REVIEW_SERVICE_IMAGE in release.env}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Staging}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${REVIEW_POSTGRES_DB:?Set
        REVIEW_POSTGRES_DB};Username=${REVIEW_POSTGRES_USER:?Set REVIEW_POSTGRES_USER};Password=${REVIEW_POSTGRES_PASSWORD:?Set
        REVIEW_POSTGRES_PASSWORD}
      Authentication__Jwt__Issuer: ${AUTH_JWT_ISSUER:?Set AUTH_JWT_ISSUER}
      Authentication__Jwt__Audience: ${AUTH_JWT_AUDIENCE:?Set AUTH_JWT_AUDIENCE}
      Authentication__Jwt__JwksUri: http://auth-service:8080/.well-known/jwks.json
      Kafka__BootstrapServers: kafka:9092
      RentalService__BaseUrl: http://rental-service:8080
      RentalService__ApiKey: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      MediaService__BaseUrl: http://media-service:8080
      MediaService__ApiKey: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      rental-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
    - services
  review-migrate:
    image: ${REVIEW_MIGRATOR_IMAGE:?Set REVIEW_MIGRATOR_IMAGE in release.env}
    profiles:
    - migration
    restart: 'no'
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${REVIEW_POSTGRES_DB:?Set
        REVIEW_POSTGRES_DB};Username=${REVIEW_POSTGRES_USER:?Set REVIEW_POSTGRES_USER};Password=${REVIEW_POSTGRES_PASSWORD:?Set
        REVIEW_POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - services
  caddy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE in .env}
    restart: unless-stopped
    environment:
      DEV_DOMAIN: ${DEV_DOMAIN:?Set DEV_DOMAIN in .env}
      DEV_APP_DOMAIN: ${DEV_APP_DOMAIN:?Set DEV_APP_DOMAIN in .env}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?Set CADDY_ACME_EMAIL in .env}
    ports:
      - "127.0.0.1:${OPSI_HTTP_LOCAL_PORT:-18080}:80"
      - "127.0.0.1:${OPSI_HTTPS_LOCAL_PORT:-18443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - edge

  gateway:
    image: ${GATEWAY_IMAGE:?Set GATEWAY_IMAGE in .env}
    restart: unless-stopped
    environment:
      Routes__0__DownstreamHostAndPorts__0__Host: analytics-service
      Routes__0__DownstreamHostAndPorts__0__Port: 8080
      Routes__0__DownstreamScheme: http
      Routes__1__DownstreamHostAndPorts__0__Host: analytics-service
      Routes__1__DownstreamHostAndPorts__0__Port: 8080
      Routes__1__DownstreamScheme: ws
