# ==============================================================================
# Valkey 8.1 ACL Configuration Template for RecommendationService & Inventory
# ==============================================================================
# Security Policy:
# - Minimal privilege: Only required commands and keys are permitted.
# - Namespace isolation: Access restricted to rec:* namespace.
# - Administrative separation: FLUSHDB, FLUSHALL, ACL, CONFIG, DEBUG are blocked.
# - Password credentials: Injected via secrets / deployment environment variables.
#   Do NOT store plaintext production passwords in this file.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. RecommendationService ACL Profile
# ------------------------------------------------------------------------------
# Roles & Capabilities:
# - Allowed keys: ~rec:* (includes serving data keys and lease keys)
# - Allowed commands:
#   * Connection / Handshake: ping, info, client|setname, client|getname, command, select, hello, quit, time
#   * Data & Lease management: get, set, del, expire, ttl, zadd, zrange, zcard
#   * Lua scripting: eval, evalsha, script|exists, script|load
# - Blocked commands:
#   * Administrative / dangerous: flushdb, flushall, acl, config, shutdown, debug, keys
#
# Syntax for valkey.conf / aclfile:
user recommendation_user on >${RECOMMENDATION_VALKEY_PASSWORD} ~rec:* &* resetchannels -@all +ping +info +client|setname +client|getname +command +select +hello +quit +time +echo +get +set +del +unlink +expire +ttl +zadd +zrange +zcard +eval +evalsha +script|exists +script|load

# ------------------------------------------------------------------------------
# 2. InventoryService ACL Profile (Read-Only Consumer)
# ------------------------------------------------------------------------------
# Roles & Capabilities:
# - Allowed keys: ~rec:* (serving data keys only)
# - Allowed commands:
#   * Connection / Handshake: ping, info, client|setname, client|getname, select, hello, quit
#   * Read-only data queries: zrange, zcard, get, ttl
# - Blocked commands:
#   * Write/Mutation: set, del, zadd, zrem, expire, flushdb, flushall, eval
#
# Syntax for valkey.conf / aclfile:
user inventory_user on >${INVENTORY_VALKEY_PASSWORD} ~rec:* &* resetchannels -@all +ping +info +client|setname +client|getname +select +hello +quit +echo +zrange +zrevrange +zcard +get +ttl
